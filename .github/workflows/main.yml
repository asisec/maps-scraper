name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Laravel Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: secret
          MONGO_INITDB_DATABASE: maps_scraper
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ connectionStatus: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mongodb, mbstring, xml, ctype, json, bcmath, gd
          coverage: none

      - name: Copy Laravel environment file
        working-directory: ./backend
        run: cp .env.example .env

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-mongodb

      - name: Generate application key
        working-directory: ./backend
        run: php artisan key:generate

      - name: Run PHPUnit tests
        working-directory: ./backend
        env:
          DB_CONNECTION: mongodb
          DB_HOST: 127.0.0.1
          DB_PORT: 27017
          DB_DATABASE: maps_scraper
          DB_USERNAME: root
          DB_PASSWORD: secret
          DB_AUTHENTICATION_DATABASE: admin
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
        run: php artisan test

  frontend-tests:
    name: AngularJS Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build frontend assets
        working-directory: ./frontend
        run: npm run build --if-present

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: maps-scraper/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: maps-scraper/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max